name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# A superseded PR run has nothing to say. A push run ends in a deploy, and a
# deploy is never cut off half-way: the next push waits for it instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # TRAP: Node 22 ships npm 10, and npm 10 and 11 disagree about this tree.
      # `@cloudflare/vitest-pool-workers` pins a nested `wrangler@4` whose
      # `@cloudflare/workers-types@^4` is an OPTIONAL PEER dependency: npm 11
      # prunes it from the lock, npm 10 refuses `npm ci` without it. Writing the
      # lock with npm 10 does not settle it -- the next `npm install` on a
      # developer's npm 11 deletes the entry again and CI goes red with nothing
      # in the diff to explain why. Pinning the runner to the npm the repository
      # is developed with is what keeps the lock a single, stable artefact.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check

  etl:
    runs-on: ubuntu-latest
    env:
      # TRAP: with CI set, a missing dependency is a hard failure rather than a
      # skip. A green run that silently tested nothing is worse than a red one,
      # because it looks like evidence (CLAUDE.md section 3).
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m "not live"

  e2e:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Same pin, same reason as the `node` job above: Node 22 ships npm 10,
      # which will not `npm ci` this lock.
      - run: npm install -g npm@11
      - run: npm ci
      # Firefox too: it caches HEAD answers where Chrome does not, and the
      # range reads broke there alone. See playwright.config.ts.
      - run: npx playwright install --with-deps chromium firefox
      # `pretest:e2e` copies the 77 MB engine out of node_modules and seeds it,
      # with the Parquet fixtures, into the LOCAL R2 bucket the Worker reads.
      # Runs against `wrangler dev` -- assets, API and data on one origin, the
      # same shape as production. See playwright.config.ts and ADR-0012.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # dev goes to the stable preview host, which every branch preview's Google
  # sign-in passes through (ADR-0036); main goes to recherche-maison.com. D1
  # migrations run inside the Worker (server/db.ts), so a deploy is a build and
  # an upload.
  deploy:
    needs: [node, etl, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Read-only use of the weekly job's key, and only in this job: the e2e job
      # builds with no credentials on purpose, because that is the build a
      # laptop does. See ADR-0045.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Same pin, same reason as the `node` job above.
      - run: npm install -g npm@11
      - run: npm ci
      # TRAP: the departement pages are prerendered from this file and ASSETS
      # ships `dist/` whole, so a deploy that built without it would replace a
      # hundred and one indexed pages with the sample's two -- green, and
      # silent. The fetch is deliberately unguarded: a missing object or a wrong
      # key fails the deploy instead. See ADR-0045.
      - name: Install rclone
        run: sudo -v ; curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Fetch the departement aggregate
        run: rclone copyto r2:ademe-dpe/v1/aggregates.json src/seo/aggregates.json
      - run: npm run build
      # TRAP: without `--env preview` this deploys the top-level config --
      # production's D1 and recherche-maison.com -- straight from dev.
      - if: github.ref == 'refs/heads/dev'
        run: npx wrangler deploy --env preview
      - if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy
