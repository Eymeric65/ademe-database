name: ETL weekly delta

# The schedule is only safe now that reconciliation exists. The delta cannot see
# a certificate that LEFT the dataset -- dpe03existant is a virtual view filtered
# dpe_desactive = 0 -- so scheduling this before ADR-0007 would have automated
# the drift rather than the update.
#
# 04:10 UTC Monday: off-peak in CET, and away from the top of the hour where
# everybody else's cron lands on ADEME.
on:
  schedule:
    - cron: '10 4 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'The source to update'
        type: choice
        options: [all, existant, neuf, tertiaire, audit]
        default: all
      since:
        description: 'Override the manifest high_water (YYYY-MM-DD)'
        required: false
      dry_run:
        description: 'Fetch, merge, reconcile, check and split, but upload nothing'
        type: boolean
        default: false

# Never cancel a run in flight: it is mid-way through rewriting partitions on
# R2, and a half-uploaded partition with a swapped manifest is the one state
# this design exists to avoid.
concurrency:
  group: etl-weekly
  cancel-in-progress: false

jobs:
  # One job per source, one at a time: one ADEME stream (CLAUDE.md §11), and a
  # source that fails or runs long no longer takes the others with it.
  # tests/test_workflows.py keeps every registered source in the matrix, in
  # registry order. See ADR-0042.
  source:
    name: ${{ matrix.source }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        source: ${{ fromJSON((!inputs.source || inputs.source == 'all') && '["existant","neuf","tertiaire","audit"]' || format('["{0}"]', inputs.source)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The published trees are read from R2 with the job's own key, never over a
    # public URL: the bucket's public domain is what let the login gate be
    # walked around (ADR-0012), and this is what lets it go. See ADR-0033.
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      # A piped stdout is block-buffered, and a step killed by the timeout
      # never flushes: run #2 spent its last 60 minutes printing nothing.
      PYTHONUNBUFFERED: "1"
      # Optional; unset is anonymous (ADR-0013), at half the rate.
      ADEME_API_KEY: ${{ secrets.ADEME_API_KEY }}
      SOURCE: ${{ matrix.source }}
      SINCE: ${{ inputs.since }}
    steps:
      # The job holds the published tree, its merge and possibly a reconciled
      # copy: well past the runner's free disk. The toolchains below are
      # preinstalled and never used here.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      # v1 for existing housing, v1/<subdir> for every other source.
      - name: Locate the tree
        run: |
          sub=$(uv run python -c "import sys; from ademe.config import SOURCES; print(SOURCES[sys.argv[1]].subdir)" "$SOURCE")
          echo "TREE=v1${sub:+/$sub}" >> "$GITHUB_ENV"

      # rclone rather than `wrangler r2 object put`, which caps well below the
      # largest partitions.
      - name: Install rclone
        run: sudo -v ; curl -fsSL https://rclone.org/install.sh | sudo bash

      # A source whose tree is not published yet is skipped: its first build is
      # by hand.
      - name: Published?
        id: tree
        run: |
          if [ -n "$(rclone lsf "r2:ademe-dpe/$TREE/manifest.json" 2>/dev/null)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SOURCE is not published yet; skipped"
          fi

      # Into bucket/, shaped like the bucket, then joined into the one whole tree
      # the delta, reconcile and checks have always read. The recent tree is
      # absent until the first split run has published it. See ADR-0039.
      - name: Download the published tree
        if: steps.tree.outputs.published == 'true'
        run: |
          rclone copy r2:ademe-dpe/$TREE/search bucket/$TREE/search
          rclone copy r2:ademe-dpe/$TREE/dpe    bucket/$TREE/dpe
          rclone copy r2:ademe-dpe/$TREE/index  bucket/$TREE/index
          rclone copyto r2:ademe-dpe/$TREE/manifest.json bucket/$TREE/manifest.json
          if [ -n "$(rclone lsf "r2:ademe-dpe/recent/$TREE/manifest.json" 2>/dev/null)" ]; then
            rclone copy r2:ademe-dpe/recent/$TREE/search bucket/recent/$TREE/search
            rclone copy r2:ademe-dpe/recent/$TREE/dpe    bucket/recent/$TREE/dpe
            rclone copy r2:ademe-dpe/recent/$TREE/index  bucket/recent/$TREE/index
          fi
          uv run python -m ademe.recent join --from bucket --out base --source "$SOURCE"
          rm -rf bucket

      # After the merge, before the upload: a run that cannot reconcile has
      # published nothing. Additions arrive through the delta, so anything
      # still missing here left the dataset. See ADR-0007.
      - name: Fetch, merge, reconcile, check
        if: steps.tree.outputs.published == 'true'
        run: |
          uv run python -m ademe.delta --source "$SOURCE" --base-url "base/$TREE" --out out ${SINCE:+--since "$SINCE"}
          # Nothing modified this week: no tree was written, and the split reads base.
          if [ ! -f "out/$TREE/manifest.json" ]; then exit 0; fi
          uv run python scripts/reconcile.py --source "$SOURCE" --root "out/$TREE" --out reconciled
          if [ -d "reconciled/$TREE" ]; then rm -rf "out/$TREE" && mv "reconciled/$TREE" "out/$TREE"; fi
          uv run python scripts/check_delta.py --source "$SOURCE" --out out --base-url "base/$TREE"

      # TRAP: split every week, even when the delta wrote nothing -- rows age out
      # of the paid window regardless, and a quiet week would otherwise keep them
      # paid-only. The merged tree when there is one, the joined one when not.
      - name: Split off the last two months
        if: steps.tree.outputs.published == 'true'
        run: |
          from=out; [ -f "out/$TREE/manifest.json" ] || from=base
          uv run python -m ademe.recent split --from "$from" --out publish --source "$SOURCE"
          rm -rf base out reconciled

      # The recent tree, then the counts, then the base files, the manifest LAST:
      # it names the other three, and a reader that fetches it must never be
      # pointed at a file that is not there yet. See ADR-0039.
      - name: Upload
        if: steps.tree.outputs.published == 'true' && !inputs.dry_run
        run: |
          rclone copy publish/recent/$TREE/search r2:ademe-dpe/recent/$TREE/search --checksum
          rclone copy publish/recent/$TREE/dpe    r2:ademe-dpe/recent/$TREE/dpe    --checksum
          rclone copy publish/recent/$TREE/index  r2:ademe-dpe/recent/$TREE/index  --checksum
          rclone copyto publish/recent/$TREE/manifest.json r2:ademe-dpe/recent/$TREE/manifest.json
          rclone copy publish/$TREE/recent-counts r2:ademe-dpe/$TREE/recent-counts --checksum
          rclone copy publish/$TREE/search r2:ademe-dpe/$TREE/search --checksum
          rclone copy publish/$TREE/dpe    r2:ademe-dpe/$TREE/dpe    --checksum
          rclone copy publish/$TREE/index  r2:ademe-dpe/$TREE/index  --checksum
          rclone copyto publish/$TREE/manifest.json r2:ademe-dpe/$TREE/manifest.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-manifest-${{ matrix.source }}
          path: publish/${{ env.TREE }}/manifest.json
          retention-days: 30
